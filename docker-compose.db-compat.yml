# Disposable MySQL + SQL Server for migrate/seed compatibility checks.
# Usage:
#   docker compose -f docker-compose.db-compat.yml up -d
#   # then point backend/.env at either service and run migrate:fresh --seed

services:
  mysql-compat:
    image: mysql:8.4
    container_name: zatca-mysql-compat
    environment:
      MYSQL_DATABASE: it_portfolio_compat
      MYSQL_USER: zatca
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  mssql-compat:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zatca-mssql-compat
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_Password123 -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # PHP CLI with MySQL + SQL Server drivers for running artisan against either DB.
  php-compat:
    build:
      context: .
      dockerfile: docker/php-compat.Dockerfile
    container_name: zatca-php-compat
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: local
      APP_KEY: base64:dGhpc2lzYXRlc3RrZXlmb3Jjb21wYXRjaGVja3Mh
      APP_DEBUG: "true"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    depends_on:
      mysql-compat:
        condition: service_healthy
      mssql-compat:
        condition: service_healthy
    profiles:
      - tools
